name: Build Frontend

# Build-checks the custom panel frontend so TypeScript / lint / bundling
# regressions are caught on PRs. The build had no CI coverage before. This does
# NOT publish the bundle; dist/irrigation-plus.js is still committed (HACS
# installs the repo source tree at the release tag, so it must be present there).

on:
  push:
    branches: [main, master]
    paths:
      - "custom_components/irrigation_plus/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "custom_components/irrigation_plus/frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom_components/irrigation_plus/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: custom_components/irrigation_plus/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (lint + rollup)
        run: npm run build

      - name: Verify committed bundle is up to date
        # The bundle is committed and shipped in the release tag, so it must
        # match the current source. Fail if a rebuild changes it (i.e. someone
        # edited .ts or bumped the version without rebuilding dist).
        run: |
          BUNDLES="dist/irrigation-plus.js dist/irrigation-plus-card.js dist/irrigation-plus-card-impl.js dist/irrigation-plus-card-legacy.js"
          # dist/ is gitignored-but-tracked, so a NEW bundle needs `git add -f`
          # or it stays untracked -- and git diff is blind to untracked files,
          # so a missing bundle passes the freshness check below and ships as a
          # 404. #120 built the legacy card shim, served it from panel.py, named
          # it here, and did not commit it. Check tracked-ness first.
          for bundle in $BUNDLES; do
            if ! git ls-files --error-unmatch -- "$bundle" >/dev/null 2>&1; then
              echo "::error::$bundle is built but NOT committed - run 'git add -f' on it."
              exit 1
            fi
          done
          if ! git diff --quiet -- $BUNDLES; then
            echo "::error::A committed dist bundle is out of date - rebuild the frontend and commit the result."
            git --no-pager diff --stat -- $BUNDLES
            exit 1
          fi
          echo "dist bundles are in sync with source."
