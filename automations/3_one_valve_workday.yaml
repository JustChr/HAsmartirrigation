- alias: Irrigation Plus
  description: 'Start Irrigation Plus at 05:00 when the workday sensor is on and run it only if the adjusted_run_time is >0 and run it for precisely that many seconds'
  trigger:
  - at: 05:00
    platform: time
  condition:
    condition: and
    conditions:
    - condition: state
      entity_id: 'binary_sensor.workday_sensor'
      state: 'on'
    - above: '0'
      condition: numeric_state
      entity_id: sensor.irrigation_plus_[zone_name]
  action:
  - data: {}
    entity_id: switch.irrigation_tap1
    service: switch.turn_on
  - delay:
      seconds: '{{states("sensor.irrigation_plus_[zone_name]")}}'
  - data: {}
    entity_id: switch.irrigation_tap1
    service: switch.turn_off
  - data: {}
    service: irrigation_plus.reset_bucket
    target:
      entity_id: sensor.irrigation_plus_[zone_name]
