alias: Irrigation Plus
description: 'Start Irrigation Plus based on event and run it only if the `sensor.irrigation_plus_[zone_name]` is >0 and run it for precisely that many seconds'
trigger:
  - platform: event
    event_type: irrigation_plus_start_irrigation_all_zones
condition:
  - condition: numeric_state
    entity_id: sensor.irrigation_plus_[zone_name]
    above: 0
action:
  - service: switch.turn_on
    data: {}
    entity_id: switch.irrigation_tap1
  - delay:
      seconds: '{{states("sensor.irrigation_plus_[zone_name]")}}'
  - service: switch.turn_off
    data: {}
    entity_id: switch.irrigation_tap1
  - service: irrigation_plus.reset_bucket
    data: {}
    entity_id: sensor.irrigation_plus_[zone_name]
mode: single
