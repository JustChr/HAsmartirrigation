[tool.ruff]

lint.select = [
  "E",  # pycodestyle
  "F",  # Pyflakes
  "B",  # flake‑bugbear
  "I",  # isort‑style import ordering
  "UP", # pyupgrade
  "SIM" # flake‑simplicity
]

lint.ignore = [
  "E501",  # line‑length
  "SIM102" # nested if statements
]

# Ruff exempts any name matching this pattern from F811 (redefinition of an
# unused name). The default pattern matches every leading-underscore name, so a
# private method accidentally defined twice in the same class was silently
# accepted: Python kept the second body and the first was dead code no linter
# reported. Narrowing it to bare underscores keeps `_`/`__` usable as throwaway
# targets while putting every `_private` back under F811.
lint.dummy-variable-rgx = "^_+$"

[tool.pytest.ini_options]
# Single consolidated test tree (was split across tests/, tests/unit/ and
# custom_components/irrigation_plus/tests/ before the consolidation).
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]